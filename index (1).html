<!doctype html>

<style>
:root{--bg:#f7f8ff;--white:#fff;--ink:#171a35;--muted:#78809a;--line:#e8e9f2;--purple:#5c48f4;--purple2:#765cff;--soft:#f0eeff;--red:#ef3340;--green:#36b987;--shadow:0 14px 38px rgba(45,42,100,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.hidden{display:none!important}

.auth{min-height:100vh;display:flex;align-items:flex-end;justify-content:center;padding:18px;background:
radial-gradient(circle at 15% 0,#dceeff 0 20%,transparent 42%),

.auth-hero{text-align:center;padding:26px 10px 22px;min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}
.auth-hero:before,.auth-hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.75}
.auth-hero:before{width:330px;height:150px;bottom:-55px;left:-100px;background:linear-gradient(135deg,#a48aff,#d7baff)}
.auth-hero:after{width:300px;height:150px;bottom:-55px;right:-100px;background:linear-gradient(135deg,#b4eff5,#86d9ff)}

.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:45px;height:45px;left:10px;top:-17px}.cloud:after{width:50px;height:50px;right:8px;top:-22px}
.lock{position:absolute;z-index:2;left:29px;top:14px;width:18px;height:20px;border:3px solid white;border-radius:4px}.lock:before{content:"";position:absolute;width:11px;height:11px;border:3px solid white;border-bottom:0;border-radius:9px 9px 0 0;left:1px;top:-11px}
.auth-hero h1{font-size:36px;line-height:1;margin:4px 0 9px;letter-spacing:-1.5px;z-index:2}.auth-hero p{font-size:14px;line-height:1.45;color:#59627c;margin:0;max-width:250px;z-index:2}
.form{display:grid;gap:13px}.form label{font-size:12px;font-weight:800;color:#66708b}.form input,.form select{width:100%;margin-top:6px;border:1px solid #dfe3ef;border-radius:13px;padding:14px 14px;background:#fbfcff;color:var(--ink);outline:none}.form input:focus,.form select:focus{border-color:#887aff;box-shadow:0 0 0 4px #6f5bf415}
.primary{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:white;font-weight:850;box-shadow:0 10px 22px #6655ed35}.switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}.switch button{border:0;background:none;color:var(--purple);font-weight:850}

.shell{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:76px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:17px 0;z-index:20}.side .brandmark{margin-bottom:28px}.brandmark{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#5d4bf4,#7c67ff);color:#fff;display:grid;place-items:center;font-weight:900;font-size:21px;box-shadow:0 8px 20px #6655ed30}.nav{display:grid;gap:9px}.nav button,.logout{width:45px;height:45px;border:0;border-radius:14px;background:transparent;color:#8a91a8;font-size:21px}.nav button.active,.nav button:hover{background:#efedff;color:var(--purple)}.logout{margin-top:auto}.content{margin-left:76px;padding:26px 30px 90px}.wrap{max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand-title{display:flex;align-items:center;gap:10px}.brand-title h1{font-size:24px;margin:0;letter-spacing:-.5px}.brand-title .mini-cloud{width:34px;height:26px;border-radius:14px;background:linear-gradient(135deg,#624df4,#8773ff);position:relative}.mini-cloud:after{content:"";position:absolute;left:12px;top:8px;width:10px;height:10px;border:2px solid #fff;border-radius:3px}.mini-cloud:before{content:"";position:absolute;left:14px;top:3px;width:7px;height:7px;border:2px solid #fff;border-bottom:0;border-radius:7px 7px 0 0}.account{width:40px;height:40px;border-radius:50%;background:#3e76dc;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;overflow:hidden;white-space:nowrap;text-indent:-999px}.account:after{content:"A";text-indent:0}

.searchbox{margin-top:20px;position:relative}.searchbox input{width:100%;height:48px;border:1px solid #e0e4ef;background:#fff;border-radius:15px;padding:0 16px 0 44px;outline:0;box-shadow:0 5px 18px rgba(40,44,90,.035)}.search-icon{position:absolute;left:16px;top:13px;color:#7e879d;font-size:18px}
.filters{display:flex;gap:8px;overflow:auto;padding:13px 0 3px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #e1e4ee;background:#fff;color:#66708a;border-radius:20px;padding:9px 15px;font-size:12px;font-weight:750}.filter.active{background:linear-gradient(135deg,#5d49f4,#735dff);color:#fff;border-color:transparent;box-shadow:0 6px 14px #6655ed2b}

.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 24px}.cat{border:1px solid #eceef5;border-radius:17px;background:#fff;padding:18px 12px;text-align:center;box-shadow:0 7px 22px rgba(47,49,100,.045)}.cat .folder{width:38px;height:31px;margin:0 auto 10px;border-radius:6px 7px 7px 7px;position:relative}.cat .folder:before{content:"";position:absolute;left:0;top:-5px;width:17px;height:9px;border-radius:5px 5px 0 0;background:inherit}.cat b{font-size:12px}.cat small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.c1 .folder{background:#3889ef}.c2 .folder{background:#43c978}.c3 .folder{background:#f24d98}.c4 .folder{background:#ff961e}.c5 .folder{background:#8953ef}.c6 .folder{background:#ff4d55}.c7 .folder{background:#21b8a8}.cat.add{border-style:dashed;display:grid;place-items:center;min-height:98px;color:#737b91}.plus{font-size:26px;line-height:1;margin-bottom:4px}

.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}.sectionhead h2{font-size:18px;margin:0}.viewall{border:0;background:none;color:var(--purple);font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #eceef5;border-radius:16px;padding:13px;box-shadow:0 7px 20px rgba(40,44,90,.045)}.cardtop{display:flex;gap:11px;align-items:center}.type{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:#eeeaff;color:var(--purple);font-size:21px;flex:none}.card h3{font-size:13px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{font-size:10px;color:#7a8298;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:270px}.group{display:inline-block;margin-top:10px;padding:4px 8px;border-radius:9px;background:#f0edff;color:#6654e8;font-size:9px;font-weight:800}.desc{font-size:10px;color:#8991a5;margin-top:7px}.meta{display:flex;align-items:center;justify-content:space-between;margin-top:11px;color:#8a92a5;font-size:10px}.mini{display:flex;gap:5px}.mini button{width:31px;height:30px;border:1px solid #e5e7ef;background:#fff;border-radius:9px;color:#6e768c}.mini .danger{color:#ed4c58}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:17px 0}.action{border:1px solid #eceef5;background:#fff;border-radius:17px;padding:15px;text-align:left;box-shadow:0 7px 20px rgba(40,44,90,.045)}.action .ico{width:39px;height:39px;border-radius:12px;background:#efedff;color:#624df4;display:grid;place-items:center;font-size:20px;margin-bottom:9px}.action b{display:block;font-size:13px}.action small{display:block;color:#8a92a5;font-size:10px;margin-top:3px}

.bottom{display:none}.modal{position:fixed;inset:0;background:rgba(20,24,43,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50;backdrop-filter:blur(4px)}.modal.show{display:flex}.box{width:min(460px,100%);background:#fff;border-radius:24px;padding:20px;box-shadow:0 30px 80px rgba(20,20,50,.22)}.boxhead{display:flex;align-items:center;justify-content:space-between}.box h2{font-size:20px;margin:0 0 14px}.close{border:0;background:#f1f2f7;width:34px;height:34px;border-radius:50%;font-size:20px;color:#6f7689}.notice{padding:11px 12px;border-radius:12px;background:#f2f0ff;color:#6556dc;font-size:11px;margin-bottom:14px}.confirm{text-align:center}.confirm-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:4px auto 13px;background:#eeeaff;color:#604cf4;font-size:28px;font-weight:900}.confirm p{font-size:13px;color:#7d8497;line-height:1.5}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.secondary,.dangerbtn{border:1px solid #e0e3ec;border-radius:13px;padding:13px;font-weight:800;background:#f7f8fc;color:#252a43}.dangerbtn{background:#ef3340;color:#fff;border-color:#ef3340}.downloadbtn{background:linear-gradient(135deg,#5d49f4,#735dff);border-color:transparent}.empty{grid-column:1/-1;text-align:center;padding:45px 20px;background:#fff;border:1px dashed #dfe3ed;border-radius:18px;color:#81899d;font-size:12px}.empty b{display:block;color:#262b45;font-size:14px;margin-bottom:6px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;background:#20243a;color:#fff;padding:11px 15px;border-radius:12px;font-size:12px;box-shadow:0 10px 30px #0003}

@media(max-width:700px){
 .side{display:none}.content{margin-left:0;padding:17px 14px 88px}.top{padding:0 3px}.brand-title h1{font-size:21px}.searchbox{margin-top:15px}.category-grid{grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:19px}.cat{padding:12px 5px;border-radius:14px;min-height:92px}.cat .folder{width:34px;height:28px;margin-bottom:8px}.cat b{font-size:10px}.cat small{font-size:8px}.actions{grid-template-columns:1fr 1fr}.action{padding:12px}.action small{display:none}.grid{grid-template-columns:1fr}.url{max-width:220px}.bottom{position:fixed;display:flex;left:0;right:0;bottom:0;height:67px;background:rgba(255,255,255,.96);border-top:1px solid #e8e9f2;z-index:30;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(15px)}.bottom button{flex:1;border:0;background:none;color:#9299ac;font-size:21px}.bottom button.active{color:var(--purple)}.auth{align-items:flex-end;padding:10px}.authbox{padding:15px 15px 22px;border-radius:28px}.auth-hero{min-height:285px}.auth-hero h1{font-size:34px}.account{width:38px;height:38px}.sectionhead{margin-top:3px}
}
@media(min-width:701px){.auth{align-items:center}.authbox{padding:28px}.auth-hero{min-height:240px}.category-grid{grid-template-columns:repeat(7,1fr)}}
</style>
</head>
<body>

<section id="auth" class="auth">
  <div class="authbox">
    <div class="auth-hero">
      <div class="cloud"><span class="lock"></span></div>
      <h1>Vault</h1>
      <p>Simpan Link &amp; File Anda<br> dengan Aman di Cloud</p>
    </div>
    <form id="authForm" class="form">
      <label>Email<input id="email" type="email" placeholder="nama@email.com" required></label>
      <label>Password<input id="password" type="password" placeholder="Minimal 6 karakter" minlength="6" required></label>
      <button class="primary" id="authBtn">Masuk <span style="float:right">→</span></button>
    </form>
    <div class="switch"><span id="switchText">Belum punya akun?</span> <button id="switchBtn" type="button">Daftar</button></div>
  </div>
</section>

<section id="app" class="hidden">
<div class="shell">
  <aside class="side">
    <div class="brandmark">V</div>
    <div class="nav">
      <button class="active" onclick="loadItems()">⌂</button>
      <button onclick="showFavorites()">☆</button>
    </div>
    <button class="logout" onclick="logout()">↪</button>
  </aside>

  <main class="content">
    <div class="wrap">
      <div class="top">
        <div class="brand-title"><div class="mini-cloud"><span class="mini-lock"></span></div><h1>Vault</h1></div>
        <button id="account" class="account" type="button" onclick="openProfile()" aria-label="Profil akun"></button>
      </div>

      <div class="searchbox"><span class="search-icon">⌕</span><input id="search" placeholder="Cari file atau link..."></div>
      <div id="filters" class="filters"></div>

      <div class="category-grid">
        <button class="cat c1" onclick="setGroup('Umum')"><div class="folder"></div><b>Umum</b><small id="cntUmum">Koleksi</small></button>
        <button class="cat c2" onclick="setGroup('Kerja')"><div class="folder"></div><b>Kerja</b><small>Koleksi</small></button>
        <button class="cat c3" onclick="setGroup('Pribadi')"><div class="folder"></div><b>Pribadi</b><small>Koleksi</small></button>
        <button class="cat c4" onclick="setGroup('Dokumen')"><div class="folder"></div><b>Dokumen</b><small>Koleksi</small></button>
        <button class="cat c5" onclick="setGroup('Foto')"><div class="folder"></div><b>Foto</b><small>Koleksi</small></button>
        <button class="cat c6" onclick="setGroup('Video')"><div class="folder"></div><b>Video</b><small>Koleksi</small></button>
        <button class="cat c7" onclick="setGroup('Aplikasi')"><div class="folder"></div><b>Aplikasi</b><small>Koleksi</small></button>
        <button class="cat add" onclick="openModal('link')"><div class="plus">+</div><b>Tambah</b></button>
      </div>

      <div class="actions">
        <button class="action" onclick="openModal('link')"><div class="ico">↗</div><b>Simpan Link</b><small>Tambahkan URL ke kelompok tertentu</small></button>
        <button class="action" onclick="openModal('file')"><div class="ico">□</div><b>Simpan File</b><small>Upload dan kelompokkan file</small></button>
      </div>

      <div class="sectionhead"><h2 id="sectionTitle">Koleksi</h2><button class="viewall" onclick="loadItems()">Lihat semua</button></div>
      <div id="grid" class="grid"></div>
    </div>
  </main>
</div>
<div class="bottom"><button class="active" onclick="loadItems()">⌂</button><button onclick="showFavorites()">☆</button><button onclick="openModal('link')">＋</button><button onclick="logout()">↪</button></div>
</section>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="box">
    <div class="boxhead"><h2 id="modalTitle">Simpan Link</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="notice">Pilih kelompok supaya koleksi lebih rapi.</div>
    <div class="form">
      <div id="linkFields">
        <label>Nama<input id="linkName" placeholder="Contoh: Website saya"></label>
        <label>URL<input id="linkUrl" placeholder="https://..."></label>
      </div>
      <div id="fileFields" style="display:none">
        <label>Nama file<input id="fileLabel" placeholder="Boleh dikosongkan"></label>
        <label>Pilih file<input id="fileInput" type="file"></label>
      </div>
      <label>Kelompok<select id="category"><option>Umum</option><option>Kerja</option><option>Pribadi</option><option>Dokumen</option><option>Foto</option><option>Video</option><option>Aplikasi</option><option>Favorit</option></select></label>
      <button class="primary" id="saveBtn" onclick="saveItem()">Simpan</button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal">
  <div class="box confirm">
    <div class="confirm-icon" id="confirmIcon">!</div>
    <h2 id="confirmTitle">Konfirmasi</h2>
    <p id="confirmText"></p>
    <div class="confirm-actions"><button class="secondary" onclick="closeConfirm()">Batal</button><button id="confirmBtn" class="dangerbtn">Lanjutkan</button></div>
  </div>
</div>

<div id="profileModal" class="modal" onclick="if(event.target===this)closeProfile()">
  <div class="box">
    <div class="boxhead"><h2>Profil Akun</h2><button class="close" onclick="closeProfile()">×</button></div>
    <div style="text-align:center;padding:8px 0 20px">
      <div id="profileAvatar" style="width:72px;height:72px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,#5d49f4,#735dff);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900"></div>
      <div id="profileName" style="font-size:18px;font-weight:850">Akun Vault</div>
      <div id="profileEmail" style="font-size:12px;color:#7d8497;margin-top:5px;word-break:break-all"></div>
    </div>
    <div style="display:grid;gap:9px">
      <div style="padding:13px 14px;border:1px solid #e8e9f2;border-radius:13px;background:#fafbff">
        <div style="font-size:10px;color:#8a92a5">Status akun</div>
        <div style="font-size:13px;font-weight:800;color:#36a879;margin-top:3px">● Aktif</div>
      </div>
      <button class="secondary" onclick="closeProfile();logout()">Keluar dari akun</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>

const SUPABASE_URL="https://cnjssbqdmgfnvdtsudwx.supabase.co";
const SUPABASE_KEY="sb_publishable_Btz0DaQ6caSL30NsCNY6-g_d3p3l-LZ";
const BUCKET="vault-files";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let mode="link",items=[],favoritesOnly=false,currentType="all",currentGroup="all",confirmAction=null,registerMode=false;
const $=id=>document.getElementById(id);
function toast(m){$("toast").textContent=m;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2500)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function formatSize(n){if(!n)return"File";let u=["B","KB","MB","GB"],i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]}
function openModal(m){mode=m;$("modal").classList.add("show");$("modalTitle").textContent=m==="link"?"Simpan Link":"Simpan File";$("linkFields").style.display=m==="link"?"block":"none";$("fileFields").style.display=m==="file"?"block":"none";$("linkName").value="";$("linkUrl").value="";$("fileLabel").value="";$("fileInput").value=""}
function closeModal(){$("modal").classList.remove("show")}
function ask(title,text,kind,fn){$("confirmTitle").textContent=title;$("confirmText").textContent=text;$("confirmIcon").textContent=kind==="download"?"↓":"!";$("confirmBtn").textContent=kind==="download"?"Unduh":"Hapus";$("confirmBtn").className=kind==="download"?"dangerbtn downloadbtn":"dangerbtn";confirmAction=fn;$("confirmModal").classList.add("show")}
function closeConfirm(){confirmAction=null;$("confirmModal").classList.remove("show")}
$("confirmBtn").onclick=async()=>{let f=confirmAction;closeConfirm();if(f)await f()}
$("switchBtn").onclick=()=>{registerMode=!registerMode;$("authTitle").textContent=registerMode?"Buat akun Vault":"Masuk ke Vault";$("authBtn").textContent=registerMode?"Daftar":"Masuk";$("switchText").textContent=registerMode?"Sudah punya akun?":"Belum punya akun?";$("switchBtn").textContent=registerMode?"Masuk":"Daftar"}
$("authForm").onsubmit=async e=>{e.preventDefault();$("authBtn").disabled=true;let email=$("email").value.trim(),password=$("password").value;let r=registerMode?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});$("authBtn").disabled=false;if(r.error){toast(r.error.message);return}if(registerMode&&!r.data.session){toast("Akun dibuat. Cek email verifikasi.");return}enterApp()}
async function enterApp(){let {data:{user}}=await db.auth.getUser();if(!user)return;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("account").textContent=user.email;loadItems()}
async function logout(){await db.auth.signOut()}
function buildFilters(){let groups=[...new Set(items.map(x=>x.category||"Umum"))].sort();$("filters").innerHTML=`<button class="filter ${currentType==="all"?"active":""}" onclick="setType('all')">Semua</button><button class="filter ${currentType==="link"?"active":""}" onclick="setType('link')">🔗 Link</button><button class="filter ${currentType==="file"?"active":""}" onclick="setType('file')">📁 File</button>`+groups.map(g=>`<button class="filter ${currentGroup===g?"active":""}" onclick="setGroup('${esc(g)}')">${esc(g)}</button>`).join("")}
function setType(t){currentType=t;currentGroup="all";favoritesOnly=false;$("sectionTitle").textContent="Koleksi";buildFilters();render()}
function setGroup(g){currentGroup=g;favoritesOnly=false;$("sectionTitle").textContent="Kelompok: "+g;buildFilters();render()}
async function loadItems(){favoritesOnly=false;currentType="all";currentGroup="all";$("sectionTitle").textContent="Koleksi";let r=await db.from("items").select("*").order("created_at",{ascending:false});if(r.error){toast(r.error.message);return}items=r.data||[];buildFilters();render()}
async function showFavorites(){favoritesOnly=true;currentType="all";currentGroup="all";$("sectionTitle").textContent="Favorit";let r=await db.from("items").select("*").eq("favorite",true).order("created_at",{ascending:false});if(r.error){toast(r.error.message);return}items=r.data||[];buildFilters();render()}
function render(){let q=$("search").value.toLowerCase();let list=items.filter(x=>(currentType==="all"||x.type===currentType)&&(currentGroup==="all"||(x.category||"Umum")===currentGroup)&&(x.name+" "+x.value+" "+(x.category||"")).toLowerCase().includes(q));if(!list.length){$("grid").innerHTML='<div class="empty"><b>Tidak ada koleksi</b>Belum ada item pada kelompok ini.</div>';return}$("grid").innerHTML=list.map(x=>`<article class="card"><div class="cardtop"><div class="type">${x.type==="file"?"📄":"🔗"}</div><div><h3>${esc(x.name)}</h3><div class="url">${esc(x.value)}</div></div></div><span class="group">${esc(x.category||"Umum")}</span><div class="desc">${x.type==="file"?formatSize(x.size):"Link tersimpan"} · ${new Date(x.created_at).toLocaleDateString("id-ID")}</div><div class="meta"><span>${x.favorite?"Favorit":"Tersimpan"}</span><div class="mini"><button onclick="toggleFav('${x.id}',${!!x.favorite})">${x.favorite?"★":"☆"}</button>${x.type==="file"?`<button onclick="requestDownload('${x.id}')">↓</button>`:`<button onclick="window.open('${esc(x.value)}','_blank')">↗</button>`}<button class="danger" onclick="requestDelete('${x.id}','${x.type}','${esc(x.storage_path||"")}')">×</button></div></div></article>`).join("")}
$("search").oninput=render;
async function saveItem(){$("saveBtn").disabled=true;try{let {data:{user}}=await db.auth.getUser();if(!user)throw Error("Sesi login habis.");if(mode==="link"){let name=$("linkName").value.trim(),url=$("linkUrl").value.trim();if(!name||!url)throw Error("Isi nama dan URL.");if(!/^https?:\/\//i.test(url))url="https://"+url;let r=await db.from("items").insert({user_id:user.id,type:"link",name,value:url,category:$("category").value});if(r.error)throw r.error}else{let f=$("fileInput").files[0];if(!f)throw Error("Pilih file.");if(f.size>50*1024*1024)throw Error("Maksimal file 50 MB.");let safe=f.name.replace(/[^\w.\-() ]/g,"_"),path=user.id+"/"+crypto.randomUUID()+"-"+safe;let up=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type||"application/octet-stream"});if(up.error)throw up.error;let r=await db.from("items").insert({user_id:user.id,type:"file",name:$("fileLabel").value.trim()||f.name,value:f.name,storage_path:path,mime_type:f.type,size:f.size,category:$("category").value});if(r.error){await db.storage.from(BUCKET).remove([path]);throw r.error}}closeModal();toast("Berhasil disimpan");await loadItems()}catch(e){toast(e.message||"Gagal menyimpan")}$("saveBtn").disabled=false}
async function toggleFav(id,current){let r=await db.from("items").update({favorite:!current}).eq("id",id);if(r.error)toast(r.error.message);else favoritesOnly?showFavorites():loadItems()}
function requestDelete(id,type,path){ask("Hapus item?","Item ini akan dihapus dari koleksi kamu. "+(type==="file"?"File di cloud juga akan dihapus.":"Tindakan ini tidak bisa dibatalkan."),"delete",()=>deleteItem(id,type,path))}
async function deleteItem(id,type,path){let r=await db.from("items").delete().eq("id",id);if(r.error){toast(r.error.message);return}if(type==="file"&&path)await db.storage.from(BUCKET).remove([path]);toast("Item berhasil dihapus");favoritesOnly?showFavorites():loadItems()}
function requestDownload(id){ask("Unduh file?","File akan diunduh ke perangkat kamu. Lanjutkan?","download",()=>downloadFile(id))}
async function downloadFile(id){let x=items.find(v=>v.id===id);if(!x)return;let r=await db.storage.from(BUCKET).createSignedUrl(x.storage_path,120);if(r.error){toast(r.error.message);return}let a=document.createElement("a");a.href=r.data.signedUrl;a.download=x.value;a.target="_blank";document.body.appendChild(a);a.click();a.remove();toast("Download dimulai")}
db.auth.onAuthStateChange((e,s)=>{if(s)enterApp();else{$("auth").classList.remove("hidden");$("app").classList.add("hidden")}})

</script>
<script>
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
</script>

<script>
window.currentUser = window.currentUser || null;
async function syncCurrentUser(){
  try{
    const client = window.sb || window.supabaseClient || window.supabase;
    if(client?.auth){
      const r = await client.auth.getUser();
      window.currentUser = r?.data?.user || null;
    }
  }catch(e){}
}
function openProfile(){
  syncCurrentUser().finally(()=>{
    const user=window.currentUser;
    const email=user?.email || 'Akun Vault';
    const name=user?.user_metadata?.full_name || user?.user_metadata?.name || (email.includes('@') ? email.split('@')[0] : 'Akun Vault');
    document.getElementById('profileAvatar').textContent=(name.trim().charAt(0)||'A').toUpperCase();
    document.getElementById('profileName').textContent=name;
    document.getElementById('profileEmail').textContent=email;
    document.getElementById('profileModal').classList.add('show');
  });
}
function closeProfile(){document.getElementById('profileModal')?.classList.remove('show');}
</script>
